<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>75 Soft — First-Time Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="gate-screen">
    <div class="gate-logo">🌿</div>
    <h1 class="gate-title">First-Time Setup</h1>
    <p class="gate-sub">Set the family password that everyone will use<br>to access the tracker. Do this once, then delete this page.</p>
    <div class="gate-form">
      <div class="input-group">
        <label class="input-label">Family password</label>
        <input class="input" id="pw-input" type="password" placeholder="Choose a password" />
      </div>
      <div class="input-group">
        <label class="input-label">Confirm password</label>
        <input class="input" id="pw-confirm" type="password" placeholder="Confirm password" />
      </div>
      <button class="btn btn-primary" id="seed-btn">Save Password</button>
      <p class="gate-error" id="seed-error"></p>
      <p id="seed-success" style="color:#5A8F52;font-size:0.875rem;margin-top:10px;min-height:20px;"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { FIREBASE_CONFIG } from './config.js';

    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getFirestore(app);

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    document.getElementById('seed-btn').addEventListener('click', async () => {
      const pw  = document.getElementById('pw-input').value;
      const pw2 = document.getElementById('pw-confirm').value;
      const err = document.getElementById('seed-error');
      const ok  = document.getElementById('seed-success');

      if (!pw) { err.textContent = 'Enter a password.'; return; }
      if (pw !== pw2) { err.textContent = 'Passwords do not match.'; return; }
      err.textContent = '';

      try {
        const hash = await sha256(pw);
        await setDoc(doc(db, 'config', 'site'), { passwordHash: hash });
        ok.textContent = '✓ Password saved! You can now delete seed.html from your repo.';
        document.getElementById('seed-btn').disabled = true;
      } catch (e) {
        err.textContent = 'Error saving: ' + e.message;
      }
    });
  </script>
</body>
</html>
